swagger: "2.0"
info:
  title: Software Factory API
  version: "1.0"
  description: |
    Loopback-only API for creating and controlling Software Factory tasks.
    Call GET /control, copy its token, then use Authorize to set the mutation token.
basePath: /api/v1
schemes:
  - http
consumes:
  - application/json
produces:
  - application/json
tags:
  - name: System
  - name: Tasks
securityDefinitions:
  MutationToken:
    type: apiKey
    name: X-Software-Factory-Token
    in: header
paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Get service health
      responses:
        "200":
          description: Current health and configuration errors
          schema:
            $ref: "#/definitions/Health"
  /config:
    get:
      tags: [System]
      operationId: getConfig
      summary: Get resolved configuration
      responses:
        "200":
          description: Resolved configuration and validation errors
          schema:
            $ref: "#/definitions/ConfigResponse"
  /harnesses:
    get:
      tags: [System]
      operationId: getHarnesses
      summary: List available coding agents
      responses:
        "200":
          description: Available harnesses
          schema:
            $ref: "#/definitions/HarnessesResponse"
  /models:
    get:
      tags: [System]
      operationId: getModels
      summary: List available models for a harness
      parameters:
        - in: query
          name: harness
          type: string
          required: false
          description: Harness name (default pi)
      responses:
        "200":
          description: Available models
          schema:
            $ref: "#/definitions/ModelsResponse"
        "503":
          $ref: "#/responses/ServiceUnavailable"
  /control:
    get:
      tags: [System]
      operationId: getControl
      summary: Get the per-process mutation token
      responses:
        "200":
          description: Control state and mutation token
          schema:
            $ref: "#/definitions/Control"
  /tasks:
    get:
      tags: [Tasks]
      operationId: listTasks
      summary: List tasks
      responses:
        "200":
          description: Tasks ordered newest first
          schema:
            type: array
            items:
              $ref: "#/definitions/Task"
        "500":
          $ref: "#/responses/InternalError"
    post:
      tags: [Tasks]
      operationId: createTask
      summary: Create a task draft
      security:
        - MutationToken: []
      parameters:
        - in: body
          name: task
          required: true
          schema:
            $ref: "#/definitions/CreateTaskRequest"
      responses:
        "201":
          description: Task draft created
          schema:
            $ref: "#/definitions/Task"
        "403":
          $ref: "#/responses/Forbidden"
        "422":
          $ref: "#/responses/UnprocessableEntity"
  /tasks/{id}:
    parameters:
      - $ref: "#/parameters/TaskID"
    get:
      tags: [Tasks]
      operationId: getTask
      summary: Get a task
      responses:
        "200":
          description: Task
          schema:
            $ref: "#/definitions/Task"
        "404":
          $ref: "#/responses/NotFound"
        "500":
          $ref: "#/responses/InternalError"
    delete:
      tags: [Tasks]
      operationId: deleteTask
      summary: Delete an inactive task and its files
      security:
        - MutationToken: []
      responses:
        "200":
          description: Task deleted
          schema:
            $ref: "#/definitions/DeletedResponse"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
        "409":
          $ref: "#/responses/Conflict"
        "500":
          $ref: "#/responses/InternalError"
  /tasks/{id}/sessions:
    parameters:
      - $ref: "#/parameters/TaskID"
    get:
      tags: [Tasks]
      operationId: listTaskSessions
      summary: List a task's sessions
      responses:
        "200":
          description: Sessions ordered oldest first, including the initial session
          schema:
            type: array
            items:
              $ref: "#/definitions/Task"
        "404":
          $ref: "#/responses/NotFound"
        "500":
          $ref: "#/responses/InternalError"
    post:
      tags: [Tasks]
      operationId: createTaskSession
      summary: Create another session in a task
      security:
        - MutationToken: []
      parameters:
        - in: body
          name: session
          required: true
          schema:
            $ref: "#/definitions/CreateSessionRequest"
      responses:
        "201":
          description: Session draft created
          schema:
            $ref: "#/definitions/Task"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
        "422":
          $ref: "#/responses/UnprocessableEntity"
  /tasks/{id}/start:
    parameters:
      - $ref: "#/parameters/TaskID"
    post:
      tags: [Tasks]
      operationId: startTask
      summary: Start repository preparation and planning
      security:
        - MutationToken: []
      responses:
        "202":
          $ref: "#/responses/Accepted"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
        "409":
          $ref: "#/responses/Conflict"
        "422":
          $ref: "#/responses/UnprocessableEntity"
  /tasks/{id}/approve:
    parameters:
      - $ref: "#/parameters/TaskID"
    post:
      tags: [Tasks]
      operationId: approveTask
      summary: Approve the plan and continue the task
      security:
        - MutationToken: []
      parameters:
        - in: header
          name: X-Software-Factory-Actor
          type: string
          required: false
          default: local-user
          description: Actor recorded with the approval
      responses:
        "202":
          $ref: "#/responses/Accepted"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
        "409":
          $ref: "#/responses/Conflict"
        "422":
          $ref: "#/responses/UnprocessableEntity"
  /tasks/{id}/feedback:
    parameters:
      - $ref: "#/parameters/TaskID"
    post:
      tags: [Tasks]
      operationId: reviseTaskPlan
      summary: Answer Planner questions and revise the plan
      security:
        - MutationToken: []
      parameters:
        - in: body
          name: feedback
          required: true
          schema:
            $ref: "#/definitions/FeedbackRequest"
      responses:
        "202":
          $ref: "#/responses/Accepted"
        "409":
          $ref: "#/responses/Conflict"
        "422":
          $ref: "#/responses/UnprocessableEntity"
  /tasks/{id}/interventions:
    parameters:
      - $ref: "#/parameters/TaskID"
    get:
      tags: [Tasks]
      operationId: listTaskInterventions
      responses:
        "200":
          description: Persisted Task interventions
          schema:
            type: array
            items:
              $ref: "#/definitions/Intervention"
    post:
      tags: [Tasks]
      operationId: commentOnTaskHistory
      summary: Add an idempotent comment to a Task, Attempt, Event, or Artifact
      security:
        - MutationToken: []
      parameters:
        - in: body
          name: intervention
          required: true
          schema:
            $ref: "#/definitions/InterventionRequest"
      responses:
        "202":
          description: Intervention persisted
          schema:
            $ref: "#/definitions/Intervention"
  /tasks/{id}/pause:
    parameters:
      - $ref: "#/parameters/TaskID"
    post:
      tags: [Tasks]
      operationId: pauseTask
      summary: Pause an active task
      security:
        - MutationToken: []
      responses:
        "202":
          $ref: "#/responses/Accepted"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
        "409":
          $ref: "#/responses/Conflict"
        "422":
          $ref: "#/responses/UnprocessableEntity"
  /tasks/{id}/resume:
    parameters:
      - $ref: "#/parameters/TaskID"
    post:
      tags: [Tasks]
      operationId: resumeTask
      summary: Resume a paused or recoverable blocked task
      security:
        - MutationToken: []
      responses:
        "202":
          $ref: "#/responses/Accepted"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
        "409":
          $ref: "#/responses/Conflict"
        "422":
          $ref: "#/responses/UnprocessableEntity"
  /tasks/{id}/abort:
    parameters:
      - $ref: "#/parameters/TaskID"
    post:
      tags: [Tasks]
      operationId: abortTask
      summary: Abort a task
      security:
        - MutationToken: []
      responses:
        "202":
          $ref: "#/responses/Accepted"
        "403":
          $ref: "#/responses/Forbidden"
        "404":
          $ref: "#/responses/NotFound"
        "409":
          $ref: "#/responses/Conflict"
        "422":
          $ref: "#/responses/UnprocessableEntity"
  /tasks/{id}/attempts:
    parameters:
      - $ref: "#/parameters/TaskID"
    get:
      tags: [Tasks]
      operationId: listTaskAttempts
      summary: List Task attempts
      responses:
        "200":
          description: Task attempts
          schema:
            type: array
            items:
              $ref: "#/definitions/Phase"
        "404":
          $ref: "#/responses/NotFound"
        "500":
          $ref: "#/responses/InternalError"
  /tasks/{id}/events:
    parameters:
      - $ref: "#/parameters/TaskID"
    get:
      tags: [Tasks]
      operationId: listTaskEvents
      summary: List task events after a cursor or read the newest event tail
      parameters:
        - in: query
          name: after
          description: Return events after this cursor. Ignored when tail is set.
          type: integer
          format: int64
          minimum: 0
          default: 0
        - in: query
          name: limit
          description: Maximum events returned for a cursor read.
          type: integer
          minimum: 1
          maximum: 1000
          default: 250
        - in: query
          name: tail
          description: Return the newest events in sequence order.
          type: integer
          minimum: 1
          maximum: 1000
      responses:
        "200":
          description: Event page and next cursor
          schema:
            $ref: "#/definitions/EventsResponse"
        "404":
          $ref: "#/responses/NotFound"
        "500":
          $ref: "#/responses/InternalError"
  /tasks/{id}/events/stream:
    parameters:
      - $ref: "#/parameters/TaskID"
    get:
      tags: [Tasks]
      operationId: streamTaskEvents
      summary: Stream task events using server-sent events
      produces:
        - text/event-stream
      parameters:
        - in: query
          name: after
          type: integer
          format: int64
          minimum: 0
          default: 0
        - in: header
          name: Last-Event-ID
          type: integer
          format: int64
          required: false
      responses:
        "200":
          description: Server-sent event stream; each event uses the SQLite sequence as its id
          schema:
            type: string
        "404":
          description: Task not found
          schema:
            $ref: "#/definitions/APIError"
        "500":
          description: Streaming unavailable
          schema:
            $ref: "#/definitions/APIError"
  /tasks/{id}/results:
    parameters:
      - $ref: "#/parameters/TaskID"
    get:
      tags: [Tasks]
      operationId: listTaskResults
      summary: List agent result envelopes
      responses:
        "200":
          description: Agent result envelopes
          schema:
            type: array
            items:
              $ref: "#/definitions/Envelope"
        "404":
          $ref: "#/responses/NotFound"
        "500":
          $ref: "#/responses/InternalError"
  /tasks/{id}/checks:
    parameters:
      - $ref: "#/parameters/TaskID"
    get:
      tags: [Tasks]
      operationId: listTaskChecks
      summary: List deterministic check results
      responses:
        "200":
          description: Check results
          schema:
            type: array
            items:
              $ref: "#/definitions/Check"
        "404":
          $ref: "#/responses/NotFound"
        "500":
          $ref: "#/responses/InternalError"
  /tasks/{id}/diff:
    parameters:
      - $ref: "#/parameters/TaskID"
    get:
      tags: [Tasks]
      operationId: getTaskDiff
      summary: Get changed files and the repository patch
      responses:
        "200":
          description: Task workspace diff
          schema:
            $ref: "#/definitions/Diff"
        "404":
          $ref: "#/responses/NotFound"
        "500":
          $ref: "#/responses/InternalError"
parameters:
  TaskID:
    in: path
    name: id
    type: string
    required: true
    pattern: '^SF-[0-9]{8}-[a-f0-9]{8}$'
    description: Task identifier
responses:
  Accepted:
    description: Command accepted
    schema:
      $ref: "#/definitions/AcceptedResponse"
  Forbidden:
    description: Mutation token missing or invalid, or foreign origin rejected
    schema:
      $ref: "#/definitions/APIError"
  NotFound:
    description: Task not found
    schema:
      $ref: "#/definitions/APIError"
  Conflict:
    description: Task state does not allow the operation
    schema:
      $ref: "#/definitions/APIError"
  UnprocessableEntity:
    description: Invalid request, repository, or service configuration
    schema:
      $ref: "#/definitions/APIError"
  ServiceUnavailable:
    description: Pi model catalog unavailable
    schema:
      $ref: "#/definitions/APIError"
  InternalError:
    description: Internal server error
    schema:
      $ref: "#/definitions/APIError"
definitions:
  APIError:
    type: object
    required: [code, message]
    properties:
      code:
        type: string
      message:
        type: string
  Health:
    type: object
    required: [status, errors]
    properties:
      status:
        type: string
        enum: [ok, degraded]
      errors:
        type: array
        items:
          type: string
  Control:
    type: object
    required: [enabled, token]
    properties:
      enabled:
        type: boolean
      token:
        type: string
        description: Per-process token required by mutation operations
  Model:
    type: object
    required: [provider, id]
    properties:
      provider:
        type: string
      id:
        type: string
      context_window:
        type: integer
        minimum: 0
  ModelsResponse:
    type: object
    required: [harness, models]
    properties:
      harness:
        type: string
      models:
        type: array
        items:
          $ref: "#/definitions/Model"
  HarnessesResponse:
    type: object
    required: [harnesses]
    properties:
      harnesses:
        type: array
        items:
          type: string
  ConfigResponse:
    type: object
    required: [config, errors]
    properties:
      config:
        $ref: "#/definitions/Config"
      errors:
        type: array
        items:
          type: string
  Config:
    type: object
    required: [defaults, observability, runtime, agents]
    properties:
      defaults:
        $ref: "#/definitions/Defaults"
      observability:
        $ref: "#/definitions/Observability"
      runtime:
        $ref: "#/definitions/Runtime"
      agents:
        type: array
        items:
          $ref: "#/definitions/Agent"
  Defaults:
    type: object
    required: [coding_agent, model, thinking]
    properties:
      coding_agent:
        type: string
        enum: [pi, codex]
      model:
        type: string
      thinking:
        $ref: "#/definitions/Thinking"
  Observability:
    type: object
    required: [poll_ms]
    properties:
      poll_ms:
        type: integer
        minimum: 1
  Runtime:
    type: object
    required: [agent_deadline_ms, empty_turn_retries, json_fix_attempts]
    properties:
      agent_deadline_ms:
        type: integer
        minimum: 1
      empty_turn_retries:
        type: integer
        minimum: 0
      json_fix_attempts:
        type: integer
        minimum: 0
  Agent:
    type: object
    required: [name, model, thinking, color, purpose, prompt_engineering]
    properties:
      name:
        type: string
        enum: [planner, builder, reviewer]
      model:
        type: string
      thinking:
        $ref: "#/definitions/Thinking"
      color:
        type: string
      purpose:
        type: string
      prompt_engineering:
        $ref: "#/definitions/PromptEngineering"
  Thinking:
    type: string
    enum: [off, minimal, low, medium, high, xhigh, max]
  PromptEngineering:
    type: object
    required: [system, user]
    properties:
      system:
        type: string
      user:
        type: string
  Repository:
    type: object
    required: [type]
    properties:
      type:
        type: string
        enum: [local, github]
      name:
        type: string
        description: Unique repository name inside the Task Workspace
      path:
        type: string
        description: Required absolute path when type is local
      repo:
        type: string
        pattern: '^[^/]+/[^/]+$'
        description: Required owner/repository when type is github
      primary:
        type: boolean
        description: Exactly one repository must be primary
  CreateTaskRequest:
    type: object
    required: [request, repositories]
    properties:
      request:
        type: string
        minLength: 1
      repositories:
        type: array
        minItems: 1
        items:
          $ref: "#/definitions/Repository"
      coding_agent:
        type: string
        enum: [pi, codex]
        description: Coding agent harness for the task (defaults to server config)
      model:
        type: string
        description: Model ID or provider/model pattern applied to all roles
      thinking:
        $ref: "#/definitions/Thinking"
  CreateSessionRequest:
    type: object
    required: [request]
    properties:
      request:
        type: string
        minLength: 1
  Task:
    type: object
    required: [id, request, workspace_path, repositories, state, total_cost, created_at]
    properties:
      id:
        type: string
      parent_task_id:
        type: string
        description: Root task ID for additional sessions; absent on the initial session
      request:
        type: string
      workspace_path:
        type: string
      primary_repository_path:
        type: string
      repositories:
        type: array
        items:
          $ref: "#/definitions/TaskRepository"
      state:
        type: string
        enum: [draft, preparing, planning, awaiting_plan_approval, building, checking, reviewing, completed, blocked, paused, aborted]
      previous_state:
        type: string
      active_phase:
        type: string
      error:
        type: string
      plan_digest:
        type: string
      approval_actor:
        type: string
      approval_at:
        type: string
        format: date-time
      total_cost:
        type: number
        format: double
      coding_agent:
        type: string
      model:
        type: string
      thinking:
        type: string
      created_at:
        type: string
        format: date-time
      started_at:
        type: string
        format: date-time
      ended_at:
        type: string
        format: date-time
  Phase:
    type: object
    required: [id, task_id, name, kind, owner, description, status, sequence, attempt, retries, started_at]
    properties:
      id:
        type: string
      task_id:
        type: string
      name:
        type: string
      kind:
        type: string
      owner:
        type: string
      description:
        type: string
      status:
        type: string
      error:
        type: string
      sequence:
        type: integer
      attempt:
        type: integer
      retries:
        type: integer
      started_at:
        type: string
        format: date-time
      ended_at:
        type: string
        format: date-time
  Event:
    type: object
    required: [sequence, id, task_id, type, payload, started_at]
    properties:
      sequence:
        type: integer
        format: int64
      id:
        type: string
      task_id:
        type: string
      phase_id:
        type: string
      parent_event_id:
        type: string
      type:
        type: string
      name:
        type: string
      payload:
        type: object
      token_count:
        type: integer
      started_at:
        type: string
        format: date-time
      ended_at:
        type: string
        format: date-time
  EventsResponse:
    type: object
    required: [events, cursor]
    properties:
      events:
        type: array
        items:
          $ref: "#/definitions/Event"
      cursor:
        type: integer
        format: int64
  Envelope:
    type: object
    required: [id, task_id, phase_id, agent_role, output_type, payload, created_at, valid, attempt]
    properties:
      id:
        type: string
      task_id:
        type: string
      phase_id:
        type: string
      agent_role:
        type: string
        enum: [planner, builder, reviewer]
      output_type:
        type: string
      payload:
        type: string
        description: JSON result envelope encoded as a string
      created_at:
        type: string
        format: date-time
      valid:
        type: boolean
      attempt:
        type: integer
  Check:
    type: object
    required: [id, task_id, phase_id, name, command, status, output, artifact_path, attempt, exit_code, duration_ms, started_at, ended_at]
    properties:
      id:
        type: string
      task_id:
        type: string
      phase_id:
        type: string
      name:
        type: string
      command:
        type: string
      status:
        type: string
      output:
        type: string
      artifact_path:
        type: string
      attempt:
        type: integer
      exit_code:
        type: integer
      duration_ms:
        type: integer
      started_at:
        type: string
        format: date-time
      ended_at:
        type: string
        format: date-time
  Diff:
    type: object
    required: [repositories]
    properties:
      repositories:
        type: array
        items:
          $ref: "#/definitions/RepositoryDiff"
  TaskRepository:
    type: object
    required: [id, task_id, name, source_type, source_value, primary, created_at]
    properties:
      id: {type: string}
      task_id: {type: string}
      name: {type: string}
      source_type: {type: string, enum: [local, github]}
      source_value: {type: string}
      submitted_path: {type: string}
      canonical_path: {type: string}
      working_path: {type: string}
      base_sha: {type: string}
      primary: {type: boolean}
      created_at: {type: string, format: date-time}
  RepositoryDiff:
    type: object
    required: [repository_id, name, files, patch]
    properties:
      repository_id: {type: string}
      name: {type: string}
      files:
        type: array
        items: {type: string}
      patch:
        type: string
  FeedbackRequest:
    type: object
    required: [feedback]
    properties:
      feedback: {type: string}
      current_plan_digest: {type: string}
  InterventionRequest:
    type: object
    required: [target_type, target_id, message, idempotency_key]
    properties:
      target_type: {type: string, enum: [task, attempt, event, artifact]}
      target_id: {type: string}
      message: {type: string}
      idempotency_key: {type: string}
  Intervention:
    type: object
    required: [id, task_id, target_type, target_id, actor, intent, text, delivery, idempotency_key, created_at]
    properties:
      id: {type: string}
      task_id: {type: string}
      target_type: {type: string}
      target_id: {type: string}
      actor: {type: string}
      intent: {type: string}
      text: {type: string}
      delivery: {type: string}
      idempotency_key: {type: string}
      created_at: {type: string, format: date-time}
  AcceptedResponse:
    type: object
    required: [accepted]
    properties:
      accepted:
        type: boolean
  DeletedResponse:
    type: object
    required: [deleted]
    properties:
      deleted:
        type: boolean
