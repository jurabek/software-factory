defaults:
  coding_agent: pi
  model: openai-codex/gpt-5.6-luna
  thinking: medium
observability:
  poll_ms: 500
runtime:
  agent_deadline_ms: 1800000
  empty_turn_retries: 2
  json_fix_attempts: 2
agents:
  - name: planner
    thinking: high
    color: "#a78bfa"
    purpose: Turn a request into a plan, identifying unresolved user decisions in questions before approval.
    prompt_engineering: {system: prompts/planner/system.md, user: prompts/planner/user.md}
  - name: builder
    color: "#22d3ee"
    purpose: Implement the approved plan exactly and report every changed file.
    prompt_engineering: {system: prompts/builder/system.md, user: prompts/builder/user.md}
  - name: reviewer
    thinking: low
    color: "#fb7185"
    purpose: Review the implementation without changing files.
    prompt_engineering: {system: prompts/reviewer/system.md, user: prompts/reviewer/user.md}
pipelines:
  - name: standard
    default: true
    stages:
      - {id: build, kind: build, agent: builder}
      - {id: check, kind: verify}
      - {id: review, kind: review, agent: reviewer}
  - name: quick
    stages:
      - {id: build, kind: build, agent: builder}
      - {id: check, kind: verify}
      - {id: review, kind: review, agent: reviewer}
claude:
  # Allowed tools are additive to inherited Claude permissions, not an
  # exclusive allowlist. Empty by default; inherited rules still apply.
  allowed_tools: []
  # Extra full model IDs (anthropic/<id> or bare). sonnet and opus are built in.
  models: []
