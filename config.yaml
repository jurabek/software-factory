# config.yaml — the factory's agent roster. One agent, one prompt, one purpose.
# Per-agent model and thinking are passed into Pi (and later other coding agents).
defaults:
  coding_agent: pi
  model: google/gemini-3.6-flash   # provider/id — a bare pattern is ambiguous across providers
  thinking: medium                 # off | minimal | low | medium | high | xhigh | max
  profile: local
  tools:
    - read
    - grep
    - find
    - ls

observability:
  poll_ms: 500

agents:
  - name: planner
    model: google/gemini-3.6-flash
    thinking: high
    color: "#a78bfa"
    purpose: Turn a request into a plan the builder can implement without asking questions.
    prompt_engineering:
      system: prompts/planner/system.md
      user: prompts/planner/user.md
    tools:
      - read
      - grep
      - find
      - ls

  - name: builder
    color: "#22d3ee"
    purpose: Implement the plan exactly; report every changed file in the envelope.
    prompt_engineering:
      system: prompts/builder/system.md
      user: prompts/builder/user.md
    tools:
      - read
      - grep
      - find
      - ls
      - edit
      - write

  - name: reviewer
    model: google/gemini-3.6-flash
    thinking: high
    color: "#fb7185"
    purpose: Confirm that what was built is what was asked for; change nothing.
    prompt_engineering:
      system: prompts/reviewer/system.md
      user: prompts/reviewer/user.md
    tools:
      - read
      - grep
      - find
      - ls

  - name: tester
    color: "#34d399"
    purpose: Run the required checks and report evidence; change nothing.
    prompt_engineering:
      system: prompts/tester/system.md
      user: prompts/tester/user.md
    tools:
      - read
      - grep
      - find
      - ls

# Domain-agnostic local profile. Replace repositories with your own.
profile:
  schemaVersion: "1.0.0"
  id: local
  version: "1.0.0"
  name: Local
  owners:
    - role: engineering
      identity: local-developer
  repositories:
    - id: app
      url: https://github.com/example/app
      defaultBranch: main
      adapter: local-git
      mode: read_write
      instructionPaths:
        - AGENTS.md
        - README.md
      defaultWritePaths:
        - "**"
      generatedPaths: []
      checkIds:
        - app-unit
        - app-lint
  riskDefaults:
    highRiskSignals:
      - authentication or authorization
      - secrets or credentials
      - data-store contract
      - destructive rollback
    prohibitedEvidenceData:
      - credentials or tokens
      - secrets
      - complete request or response payloads containing secrets
  requiredReviewKinds:
    - spec
    - standards
    - codeowners
  approvalRules:
    - id: multi-repository-plan
      when: more than one work item exists
      approval: plan
    - id: break-glass
      when: a normally read-only repository write is requested
      approval: break-glass
  deliveryProviders:
    - kind: ci
      adapter: local-ci
      access: read_only
    - kind: artifact
      adapter: campaign-artifact-store
      access: approved_write
  evaluationScenarios:
    - id: implement-requested-change
      description: Plan, implement, review, and test a change in the selected repositories
      expectedRepositories:
        - app
      requiredFindings:
        - request coverage
        - repository standards
      prohibitedBehavior:
        - writes outside approved paths
        - treating a missing check as passed
