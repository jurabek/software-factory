# Local PostgreSQL only. Application runs via scripts/local.sh (next dev).
# Daemon runs separately: go -C daemon run .
# Configure credentials through the environment, never in this file.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-factory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-factory}
      POSTGRES_DB: ${POSTGRES_DB:-factory_application}
    volumes:
      - factory-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-factory} -d $${POSTGRES_DB:-factory_application}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  factory-pgdata:
